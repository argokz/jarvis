[project]
name = "jarvis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.32.0",
    "claude-agent-sdk>=0.2.182",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "python-frontmatter>=1.3.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
