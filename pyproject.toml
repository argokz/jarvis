[project]
name = "jarvis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.32.0",
    "anthropic>=2.8.0",
    "claude-agent-sdk>=0.2.182",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "python-frontmatter>=1.3.0",
    "uvicorn[standard]>=0.54.0",
    "yandex-music>=3.2.2",
]

[project.optional-dependencies]
voice = [
    "numpy>=2.5.4",
    "openwakeword==0.4.0",
    "sounddevice>=0.5.6",
    "websockets>=17.4",
]
# Своё распознавание речи: GigaAM через ONNX, на процессоре (python -m jarvis.stt_server)
stt = [
    "onnx-asr[cpu,hub]>=0.12.0",
]
# Свой синтез речи: Silero на процессоре (python -m jarvis.tts_server)
tts = [
    "silero>=0.5.5",
    "torch>=2.15.0",
]

# PyTorch для Silero — сборка без CUDA: 210 МБ вместо нескольких гигабайт
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
